[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/hive"
  to = "/#situation"
  status = 301

[[redirects]]
  from = "/hive.html"
  to = "/#situation"
  status = 301

[[redirects]]
  from = "/books"
  to = "/"
  status = 301

[[redirects]]
  from = "/tools"
  to = "/"
  status = 301

[[redirects]]
