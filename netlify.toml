[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/hive"
  to = "/lab.html"
  status = 301

[[redirects]]
  from = "/hive.html"
  to = "/lab.html"
  status = 301

[[redirects]]
  from = "/books"
  to = "/"
  status = 301

[[redirects]]
  from = "/tools"
  to = "/"
  status = 301

[[redirects]]
  from = "/websites"
  to = "/"
  status = 301

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
