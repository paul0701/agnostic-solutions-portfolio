[[redirects]]
  from = "/lab.html"
  to = "/#situation"
  status = 301

[[redirects]]
  from = "/socratic-suite"
  to = "/"
  status = 301

[[redirects]]
  from = "/socratic-suite.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/iq-suite"
  to = "/"
  status = 301

[[redirects]]
  from = "/iq-suite.html"
  to = "/"
  status = 301
